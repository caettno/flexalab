<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexlab</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Flexlab</h1>
        <p> Laboratorio de CSS Flexbox</p>
    </header>

    <main class="conteudo">

        <section class="experimento">

            <h2>Area de experimentação</h2>
            <p class="instruções">
            Modifique as propriedades CSS do container e observe o comportamento dos elementos.
            </p>

            <div class="container">

                <div class="item item-1">

                    <span>A</span>
                    <span>B</span>

                </div>
                <div class="item item-2">2</div>
                <div class="item item-3">3</div>
                <div class="item item-4">4</div>
                <div class="item item-5">5</div>

            </div>

            <div class="acoes">

                <button type="button">Cancelar</button>
                <button type="button">Salvar</button>
                <button type="button">Publicar</button>

            </div>

        </section>

        <section class="cartas">

            <div class="cards">

            <h2 class="card"> Card1</h2>
            <h2 class="card"> Card2</h2>
            <h2 class="card"> Card3</h2>
            <h2 class="card"> Card4</h2>

            </div>

        </section>

    </main>   

</body>
</html>
